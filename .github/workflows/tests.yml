name: Desktop regression tests / 桌面回归测试

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests (Windows / macOS)
        if: runner.os != 'Linux'
        env:
          UI_BACKTEST_HOME: ${{ runner.temp }}/ui-backtest-test-home
        run: python run_self_tests.py
      - name: Run regression tests (Linux)
        if: runner.os == 'Linux'
        env:
          UI_BACKTEST_HOME: ${{ runner.temp }}/ui-backtest-test-home
        run: xvfb-run -a python run_self_tests.py

name: Desktop regression tests / 桌面回归测试

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Diagnose macOS fingerprint GUI test
        if: runner.os == 'macOS'
        shell: bash
        env:
          UI_BACKTEST_HOME: ${{ runner.temp }}/ui-backtest-test-home
        run: |
          python -u - <<'PY'
          import faulthandler
          import sys
          import unittest
          from test_support import prepare_test_features

          faulthandler.dump_traceback_later(60, repeat=True)
          try:
              prepare_test_features()
              suite = unittest.defaultTestLoader.discover("tests", pattern="test_v166_hedge_fingerprints.py")
              result = unittest.TextTestRunner(verbosity=2).run(suite)
          finally:
              faulthandler.cancel_dump_traceback_later()
          sys.exit(0 if result.wasSuccessful() else 1)
          PY
      - name: Run regression tests (Windows / macOS)
        if: runner.os != 'Linux'
        env:
          UI_BACKTEST_HOME: ${{ runner.temp }}/ui-backtest-test-home
        run: python -u -c "import faulthandler, runpy; faulthandler.dump_traceback_later(180, repeat=True); runpy.run_path('run_self_tests.py', run_name='__main__')"
      - name: Run regression tests (Linux)
        if: runner.os == 'Linux'
        env:
          UI_BACKTEST_HOME: ${{ runner.temp }}/ui-backtest-test-home
        run: xvfb-run -a python run_self_tests.py

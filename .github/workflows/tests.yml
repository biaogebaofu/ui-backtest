name: Desktop regression tests / 桌面回归测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      UI_BACKTEST_HOME: ${{ runner.temp }}/ui-backtest-test-home
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
      - name: Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Run regression tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: python run_self_tests.py
      - name: Run regression tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python run_self_tests.py
